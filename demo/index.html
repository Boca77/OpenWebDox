<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opendox demo</title>
    <style>
      :root {
        --canvas-bg: #e6e8ec;
        --bar-bg: #f7f8fa;
        --surface: #ffffff;
        --hairline: #c9cdd4;
        --text: #1d2129;
        --text-muted: #4a515c;
        --accent: #2f5bd3;
        --accent-soft: rgb(47 91 211 / 0.16);
        --page-shadow: 0 1px 3px rgb(40 48 64 / 0.18);
        --menu-shadow: 0 4px 16px rgb(40 48 64 / 0.16), 0 0 0 1px var(--hairline);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--canvas-bg);
        color: var(--text);
        font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 20px;
        padding: 0 16px;
        background: var(--bar-bg);
        border-bottom: 1px solid var(--hairline);
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      #stats,
      .stats {
        margin: 0;
        display: flex;
        gap: 16px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      #stats dt,
      .stats dt {
        display: inline;
      }
      #stats dd,
      .stats dd {
        display: inline;
        margin: 0 0 0 4px;
        color: var(--text);
        font-weight: 600;
      }
      /* Collaboration: document id, connection state, who's here. */
      #sync {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      #sync[hidden] {
        display: none;
      }
      #people {
        display: flex;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #people li {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #people .swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }
      button,
      select {
        min-height: 44px;
        font: inherit;
        color: var(--text);
      }
      .tool {
        padding: 0 12px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }
      .tool:hover,
      .tool[aria-expanded="true"] {
        background: var(--surface);
        border-color: var(--hairline);
      }
      /* A toggle that's on: fill and border, so the state doesn't rest on colour alone. */
      .tool[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .tool:disabled {
        color: var(--text-muted);
        cursor: default;
        opacity: 0.6;
      }
      .tool:disabled:hover {
        background: transparent;
        border-color: transparent;
      }
      .tool.icon {
        min-width: 44px;
        padding: 0;
        font-size: 15px;
      }
      .tool.icon svg {
        display: block;
        margin: auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
      }
      #italic i {
        font-family: Georgia, serif;
      }

      /* Formatting toolbar: its own row under the title bar. */
      #format-bar {
        flex-basis: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding-bottom: 4px;
      }
      #format-bar .group {
        display: flex;
        gap: 2px;
      }
      #format-bar .sep {
        width: 1px;
        height: 24px;
        margin: 0 6px;
        background: var(--hairline);
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-muted);
      }
      select {
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 4px;
        padding: 0 6px;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      /* Table size picker, like Insert ▸ Table in Google Docs. */
      .picker-wrap {
        position: relative;
      }
      #picker {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        padding: 10px;
        background: var(--surface);
        border-radius: 6px;
        box-shadow: var(--menu-shadow);
      }
      #picker[hidden] {
        display: none;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(10, 24px);
        gap: 2px;
      }
      #grid button {
        min-height: 0;
        width: 24px;
        height: 24px;
        padding: 0;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 2px;
        cursor: pointer;
      }
      #grid button.on {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      #grid button:focus-visible {
        outline-offset: 0;
      }
      #size {
        margin: 8px 0 0;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      /* Right-click menu inside tables. */
      #table-menu {
        position: fixed;
        z-index: 4;
        min-width: 200px;
        margin: 0;
        padding: 4px;
        list-style: none;
        background: var(--surface);
        border-radius: 6px;
        box-shadow: var(--menu-shadow);
      }
      #table-menu[hidden] {
        display: none;
      }
      #table-menu button {
        width: 100%;
        padding: 0 12px;
        text-align: left;
        background: transparent;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #table-menu button:hover,
      #table-menu button:focus-visible {
        background: var(--accent-soft);
        outline: none;
      }
      #table-menu hr {
        margin: 4px 0;
        border: 0;
        border-top: 1px solid var(--hairline);
      }

      #pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 16px;
      }
      .opendox-page {
        box-shadow: var(--page-shadow);
      }
      /* Images: the bar under a selected image, its wrap menu, and the options panel. */
      #image-bar {
        position: fixed;
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        background: var(--surface);
        border-radius: 8px;
        box-shadow: var(--menu-shadow);
      }
      #image-bar[hidden],
      #wrap-menu[hidden],
      #image-panel[hidden],
      #panel-body[hidden],
      #panel-empty[hidden] {
        display: none;
      }
      #image-bar .tool {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      #image-bar .sep {
        width: 1px;
        height: 24px;
        margin: 0 4px;
        background: var(--hairline);
      }
      .wrap-wrap {
        position: relative;
      }
      #image-bar svg,
      #wrap-menu svg,
      .wrap-choice svg {
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
      }
      svg .fill {
        fill: currentColor;
        stroke: none;
      }
      svg .fill.soft {
        opacity: 0.35;
      }
      #wrap-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        min-width: 220px;
        margin: 0;
        padding: 4px;
        list-style: none;
        background: var(--surface);
        border-radius: 6px;
        box-shadow: var(--menu-shadow);
      }
      #wrap-menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 0 10px;
        text-align: left;
        background: transparent;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #wrap-menu button span {
        flex: 1;
      }
      #wrap-menu button .check {
        visibility: hidden;
        stroke-width: 2;
      }
      #wrap-menu button[aria-checked="true"] {
        background: var(--accent-soft);
        font-weight: 600;
      }
      #wrap-menu button[aria-checked="true"] .check {
        visibility: visible;
      }
      #wrap-menu button:hover,
      #wrap-menu button:focus-visible {
        background: var(--accent-soft);
        outline: none;
      }
      #wrap-menu button:disabled {
        color: var(--text-muted);
        opacity: 0.6;
        cursor: default;
      }

      #image-panel {
        position: fixed;
        z-index: 2;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(320px, 100vw);
        overflow-y: auto;
        background: var(--bar-bg);
        border-left: 1px solid var(--hairline);
        box-shadow: -2px 0 8px rgb(40 48 64 / 0.08);
      }
      body.panel-open #pages {
        padding-right: 336px;
      }
      #image-panel > header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        padding: 0 4px 0 16px;
        border-bottom: 1px solid var(--hairline);
      }
      #image-panel h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      #panel-empty {
        margin: 16px;
        color: var(--text-muted);
      }
      #image-panel details {
        border-bottom: 1px solid var(--hairline);
      }
      #image-panel summary {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        padding: 0 16px;
        font-weight: 600;
        cursor: pointer;
        list-style: none;
      }
      #image-panel summary::-webkit-details-marker {
        display: none;
      }
      #image-panel summary::before {
        content: "";
        width: 6px;
        height: 6px;
        border-right: 1.6px solid currentColor;
        border-bottom: 1.6px solid currentColor;
        transform: rotate(-45deg);
        transition: transform 120ms cubic-bezier(0.2, 0, 0, 1);
      }
      #image-panel details[open] > summary::before {
        transform: rotate(45deg);
      }
      @media (prefers-reduced-motion: reduce) {
        #image-panel summary::before {
          transition: none;
        }
      }
      #image-panel summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .section {
        display: grid;
        gap: 10px;
        padding: 4px 16px 16px;
      }
      .row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .row > label {
        flex: 1;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
      }
      .row .unit {
        padding-bottom: 9px;
      }
      .section input[type="number"],
      .section textarea {
        min-height: 36px;
        width: 100%;
        padding: 4px 8px;
        font: inherit;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 4px;
      }
      .section input:disabled {
        color: var(--text-muted);
        background: transparent;
      }
      .section textarea {
        min-height: 72px;
        resize: vertical;
      }
      .section input:focus-visible,
      .section textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 0;
      }
      .section .unit,
      .section .note {
        margin: 0;
        color: var(--text-muted);
      }
      .check-row {
        min-height: 44px;
        color: var(--text);
      }
      #img-wraps {
        display: grid;
        gap: 2px;
      }
      .wrap-choice,
      .recolor-choice {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 10px;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }
      .wrap-choice:hover,
      .recolor-choice:hover {
        background: var(--surface);
        border-color: var(--hairline);
      }
      .wrap-choice[aria-pressed="true"],
      .recolor-choice[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .wrap-choice:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #recolors {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .recolor-choice .swatch {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 3px;
        box-shadow: inset 0 0 0 1px rgb(29 33 41 / 0.2);
      }
      .slider {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        color: var(--text);
      }
      .slider input {
        grid-column: 1 / -1;
        width: 100%;
        min-height: 32px;
        accent-color: var(--accent);
      }
      .slider output {
        font-variant-numeric: tabular-nums;
        color: var(--text-muted);
      }
      .text-button {
        justify-self: start;
        min-height: 36px;
        padding: 0 12px;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 4px;
        cursor: pointer;
      }
      .text-button:hover {
        border-color: var(--text-muted);
      }

      #error {
        margin: 16px;
        color: #9b1c1c;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>opendox demo</h1>
      <dl id="stats" aria-live="polite">
        <div><dt>Pages</dt><dd id="s-pages">–</dd></div>
        <div><dt>Layout</dt><dd id="s-layout">–</dd></div>
        <div><dt>Render</dt><dd id="s-render">–</dd></div>
        <div><dt>Cell</dt><dd id="s-cell">–</dd></div>
      </dl>
      <div id="sync" hidden>
        <dl class="stats">
          <div><dt>Doc</dt><dd id="s-doc">–</dd></div>
          <div><dt>Sync</dt><dd id="s-sync" aria-live="polite">–</dd></div>
        </dl>
        <ul id="people" aria-label="People on this document"></ul>
      </div>
      <div class="tools">
        <div class="picker-wrap">
          <button id="insert-table" class="tool" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker">
            Insert table
          </button>
          <div id="picker" role="dialog" aria-label="Choose table size" hidden>
            <div id="grid"></div>
            <p id="size" aria-live="polite">1 × 1</p>
          </div>
        </div>
        <button id="insert-image" class="tool">Insert image</button>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" hidden />
        <button id="export-pdf" class="tool">Download PDF</button>
        <button id="export-docx" class="tool">Download .docx</button>
        <label>
          Zoom
          <select id="zoom">
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
          </select>
        </label>
      </div>
      <div id="format-bar" role="toolbar" aria-label="Formatting">
        <button id="undo" class="tool" title="Undo (Ctrl+Z)">Undo</button>
        <button id="redo" class="tool" title="Redo (Ctrl+Y)">Redo</button>
        <span class="sep" aria-hidden="true"></span>
        <label>
          <span class="visually-hidden">Font</span>
          <select id="font">
            <option value="">Noto Sans</option>
            <option value="Noto Serif">Noto Serif</option>
          </select>
        </label>
        <label>
          <span class="visually-hidden">Font size</span>
          <select id="font-size">
            <option>8</option><option>9</option><option>10</option><option>11</option>
            <option>12</option><option>14</option><option>18</option><option>24</option>
            <option>30</option><option>36</option>
          </select>
        </label>
        <button id="bold" class="tool icon" aria-pressed="false" aria-label="Bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button id="italic" class="tool icon" aria-pressed="false" aria-label="Italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <span class="sep" aria-hidden="true"></span>
        <div class="group" role="group" aria-label="Alignment">
          <button class="tool icon" data-align="left" aria-pressed="false" aria-label="Align left" title="Align left (Ctrl+Shift+L)">
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 4h14M3 8h9M3 12h14M3 16h9" /></svg>
          </button>
          <button class="tool icon" data-align="center" aria-pressed="false" aria-label="Centre" title="Centre (Ctrl+Shift+E)">
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 4h14M5.5 8h9M3 12h14M5.5 16h9" /></svg>
          </button>
          <button class="tool icon" data-align="right" aria-pressed="false" aria-label="Align right" title="Align right (Ctrl+Shift+R)">
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 4h14M8 8h9M3 12h14M8 16h9" /></svg>
          </button>
          <button class="tool icon" data-align="justify" aria-pressed="false" aria-label="Justify" title="Justify (Ctrl+Shift+J)">
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 4h14M3 8h14M3 12h14M3 16h14" /></svg>
          </button>
        </div>
        <span class="sep" aria-hidden="true"></span>
        <label>
          Line
          <select id="line-spacing">
            <option value="1">Single</option>
            <option value="1.15">1.15</option>
            <option value="1.5">1.5</option>
            <option value="2">Double</option>
          </select>
        </label>
        <label>
          Before
          <select id="space-before">
            <option value="0">0 pt</option><option value="6">6 pt</option>
            <option value="12">12 pt</option><option value="24">24 pt</option>
          </select>
        </label>
        <label>
          After
          <select id="space-after">
            <option value="0">0 pt</option><option value="6">6 pt</option>
            <option value="12">12 pt</option><option value="24">24 pt</option>
          </select>
        </label>
      </div>
    </header>
    <main id="pages" aria-label="Document pages"></main>
    <ul id="table-menu" role="menu" aria-label="Table" hidden>
      <li role="none"><button role="menuitem" data-cmd="insertRowAbove">Insert row above</button></li>
      <li role="none"><button role="menuitem" data-cmd="insertRowBelow">Insert row below</button></li>
      <li role="none"><button role="menuitem" data-cmd="insertColumnLeft">Insert column left</button></li>
      <li role="none"><button role="menuitem" data-cmd="insertColumnRight">Insert column right</button></li>
      <li role="separator"><hr /></li>
      <li role="none"><button role="menuitem" data-cmd="deleteRow">Delete row</button></li>
      <li role="none"><button role="menuitem" data-cmd="deleteColumn">Delete column</button></li>
      <li role="none"><button role="menuitem" data-cmd="deleteTable">Delete table</button></li>
    </ul>
    <div id="image-bar" role="toolbar" aria-label="Image" hidden>
      <div class="wrap-wrap">
        <button id="wrap-trigger" class="tool" aria-haspopup="menu" aria-expanded="false" aria-controls="wrap-menu" title="Text wrapping">
          <span class="current"></span>
          <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M6 8l4 4 4-4" /></svg>
        </button>
        <ul id="wrap-menu" role="menu" aria-label="Text wrapping" hidden></ul>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <button id="image-options" class="tool" aria-expanded="false" aria-controls="image-panel">Image options</button>
      <button id="image-delete" class="tool" title="Delete (Del)">Delete</button>
    </div>
    <aside id="image-panel" aria-label="Image options" hidden>
      <header>
        <h2>Image options</h2>
        <button id="panel-close" class="tool icon" aria-label="Close image options">
          <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
        </button>
      </header>
      <p id="panel-empty">Select an image to change it.</p>
      <div id="panel-body">
        <details open>
          <summary>Size &amp; rotation</summary>
          <div class="section">
            <div class="row">
              <label class="field-label">Width <input id="img-width" type="number" min="0.05" step="0.05" /></label>
              <label class="field-label">Height <input id="img-height" type="number" min="0.05" step="0.05" /></label>
              <span class="unit">in</span>
            </div>
            <label class="check-row"><input id="img-lock" type="checkbox" checked /> Lock aspect ratio</label>
            <div class="row">
              <label class="field-label">Scale <input id="img-scale" type="number" min="1" step="5" /></label>
              <span class="unit">% of original</span>
            </div>
            <button id="img-reset-size" class="text-button" type="button">Original size</button>
            <div class="row">
              <label class="field-label">Angle <input id="img-rotation" type="number" step="1" /></label>
              <span class="unit">°</span>
              <button id="img-rotate-90" class="text-button" type="button">Rotate 90°</button>
            </div>
          </div>
        </details>
        <details>
          <summary>Text wrapping</summary>
          <div class="section"><div id="img-wraps" role="group" aria-label="Text wrapping"></div></div>
        </details>
        <details>
          <summary>Position</summary>
          <div id="position-section" class="section">
            <div class="row">
              <label class="field-label">X <input id="img-x" type="number" step="0.05" /></label>
              <label class="field-label">Y <input id="img-y" type="number" step="0.05" /></label>
              <span class="unit">in</span>
            </div>
            <p id="position-note" class="note"></p>
          </div>
        </details>
        <details>
          <summary>Recolor</summary>
          <div class="section">
            <div id="recolors" role="group" aria-label="Recolor">
              <button type="button" class="recolor-choice" data-recolor="none"><span class="swatch" style="background: linear-gradient(135deg, #4f8bd6, #e2a33b)"></span>No recolor</button>
              <button type="button" class="recolor-choice" data-recolor="grayscale"><span class="swatch" style="background: linear-gradient(135deg, #7b7b7b, #c4c4c4)"></span>Grayscale</button>
              <button type="button" class="recolor-choice" data-recolor="sepia"><span class="swatch" style="background: linear-gradient(135deg, #8a6d4b, #d9c3a5)"></span>Sepia</button>
              <button type="button" class="recolor-choice" data-recolor="negative"><span class="swatch" style="background: linear-gradient(135deg, #b0742c, #1d5cc4)"></span>Negative</button>
            </div>
          </div>
        </details>
        <details>
          <summary>Adjustments</summary>
          <div class="section">
            <label class="slider">Transparency <output id="img-transparency-out">0</output><input id="img-transparency" type="range" min="0" max="100" step="1" /></label>
            <label class="slider">Brightness <output id="img-brightness-out">0</output><input id="img-brightness" type="range" min="-100" max="100" step="1" /></label>
            <label class="slider">Contrast <output id="img-contrast-out">0</output><input id="img-contrast" type="range" min="-100" max="100" step="1" /></label>
            <button id="img-reset-adjust" class="text-button" type="button">Reset</button>
          </div>
        </details>
        <details>
          <summary>Alt text</summary>
          <div class="section">
            <label class="field-label" for="img-alt">Description</label>
            <textarea id="img-alt" placeholder="What the image shows, for people who can't see it"></textarea>
          </div>
        </details>
      </div>
    </aside>
    <script type="module" src="./main.js"></script>
  </body>
</html>
