[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
repository = ""
publish = false

[workspace.dependencies]
loro = "1.16.2"
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
