[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Boca77/OpenWebDox"
publish = false

[workspace.dependencies]
loro = "1.16.2"
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
proptest = "1.12.0"
parley = { version = "0.12.0", default-features = false }
# Same version parley uses internally, so it isn't compiled twice.
skrifa = "0.44.0"
wasm-bindgen = "0.2.129"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Bundled: compiles SQLite from source, so no system library is needed.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# PDF writing and font subsetting (both from the Typst project, pure Rust, so they build for wasm).
pdf-writer = "0.15.0"
subsetter = "0.2.6"
miniz_oxide = "0.9.1"
# Reads PDFs back in export tests.
lopdf = "0.45.0"
# Same tungstenite version axum uses, so it isn't compiled twice.
tokio-tungstenite = "0.29.0"
opendox-model = { path = "crates/opendox-model" }
opendox-layout = { path = "crates/opendox-layout" }
opendox-sync = { path = "crates/opendox-sync" }
opendox-export = { path = "crates/opendox-export" }

# Browser build (`npm run build:wasm`): smaller download for ~8% slower keystrokes (measured).
# "z" was smaller still but ~65% slower. The native server keeps plain `release`.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
